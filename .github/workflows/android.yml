name: Build GLB FBX Converter APK
on:
  push:
    branches: [main, fix/real-geometry-optimizer, fix/3mf-optional-materials-foxgi, feature/offline-glb-codecs, fix/geometry-quality-targets, feature/offline-surface-bake, feature/low-memory-bake, fix/tablet-viewer-layout, fix/bounded-uv-memory]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build web frontend
        run: npm run build
      - name: Install browser for codec integration checks
        run: npx playwright install --with-deps chromium
      - name: Check production codecs with external requests blocked
        run: npm run test:browser
      - name: Create Android project
        run: npx cap add android
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install branding image tools
        run: python -m pip install --disable-pip-version-check pillow
      - name: Register native file saver
        run: |
          mkdir -p android/app/src/main/java/com/phoenix/glbfbxconverter
          cp android-native/MainActivity.java android/app/src/main/java/com/phoenix/glbfbxconverter/MainActivity.java
          cp android-native/ModelSaverPlugin.java android/app/src/main/java/com/phoenix/glbfbxconverter/ModelSaverPlugin.java
          cp android-native/DeviceMemoryPlugin.java android/app/src/main/java/com/phoenix/glbfbxconverter/DeviceMemoryPlugin.java
      - name: Apply mascot Android branding and splash
        run: |
          python scripts/apply_android_branding.py
          test -s android/app/src/main/res/drawable/ic_launcher_foreground.png
          test -s android/app/src/main/res/drawable/splash.png
          test -s dist/branding/splash.png
      - name: Sync Android
        run: npx cap sync android
      - name: Isolate codec test APK from installed stable apps
        run: |
          set -e
          sed -i 's/applicationId "com.phoenix.glbfbxconverter"/applicationId "com.phoenix.glbfbxconverter.baketest.uvmemory"/' android/app/build.gradle
          grep -q 'applicationId "com.phoenix.glbfbxconverter.baketest.uvmemory"' android/app/build.gradle
          sed -i 's/Phoenix Model Forge/Forge UV RAM TEST/g' android/app/src/main/res/values/strings.xml
      - name: Assemble Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Verify icon and splash packed inside Android APK
        run: |
          set -e
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" > /tmp/phoenix-apk-filelist.txt
          grep -q '^res/drawable/ic_launcher_foreground.png$' /tmp/phoenix-apk-filelist.txt
          grep -q '^res/mipmap-xxxhdpi-v4/ic_launcher_foreground.png$' /tmp/phoenix-apk-filelist.txt
          if grep -Eq '(^|/)ic_launcher_foreground.xml$' /tmp/phoenix-apk-filelist.txt; then
            echo 'ERROR: Android default adaptive icon resource found'; exit 1
          fi
          grep -q 'ic_launcher.png' /tmp/phoenix-apk-filelist.txt
          grep -q 'splash.png' /tmp/phoenix-apk-filelist.txt
          for ASSET in draco/draco_wasm_wrapper.js draco/draco_decoder.wasm draco/decoder.js draco/draco_decoder_gltf.wasm draco/encoder.js draco/draco_encoder.wasm basis/basis_transcoder.js basis/basis_transcoder.wasm basis/transcoder.js ktx2/basis_encoder.wasm; do
            grep -Fqx "assets/public/codecs/$ASSET" /tmp/phoenix-apk-filelist.txt
          done
          grep -Eq '^assets/public/assets/surface-bake-worker-.*\.js$' /tmp/phoenix-apk-filelist.txt
          grep -Eq '^assets/public/assets/bake-prepare-.*\.js$' /tmp/phoenix-apk-filelist.txt
          grep -Eq '^assets/public/assets/bake-project-.*\.js$' /tmp/phoenix-apk-filelist.txt
          grep -Eq '^assets/public/assets/bake-unwrap-.*\.js$' /tmp/phoenix-apk-filelist.txt
          grep -Fqx 'assets/public/codecs/bake/XATLAS_LICENSE.txt' /tmp/phoenix-apk-filelist.txt
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          icon=Image.open('android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png')
          splash=Image.open('android/app/src/main/res/drawable/splash.png')
          assert icon.size==(192,192) and splash.size==(720,1280)
          assert Path('dist/branding/splash.png').stat().st_size>100000
          print('Verified new 192px launcher and full-screen 720x1280 splash in APK')
          PY
          cp "$APK" android/app/build/outputs/apk/debug/Phoenix-Forge-UV-RAM-TEST.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Phoenix-Forge-UV-RAM-TEST-APK
          path: android/app/build/outputs/apk/debug/Phoenix-Forge-UV-RAM-TEST.apk
          if-no-files-found: error
